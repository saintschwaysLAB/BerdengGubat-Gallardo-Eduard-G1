{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3">Delete donation record?</h1>
                <p>Delete your PHP {{ object.amount|floatformat:2 }} record for {{ object.organization.name }}?</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Delete record</button>
                    <a class="btn btn-outline-secondary" href="{% url 'donations' %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
